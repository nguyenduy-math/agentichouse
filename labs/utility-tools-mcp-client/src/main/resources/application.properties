# Console app: no web server, no banner, quiet logs (keep the chat readable).
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# --- MCP server connection (stdio) ---
# The client launches the server jar as a subprocess and talks to it over stdin/stdout.
# Path is relative to where you run the client; adjust if needed.
spring.ai.mcp.client.stdio.connections.utils.command=java
spring.ai.mcp.client.stdio.connections.utils.args=-jar,../utility-tools-mcp/target/utility-tools-mcp-0.0.1.jar
# Expose the discovered MCP tools as Spring AI ToolCallbacks.
spring.ai.mcp.client.toolcallback.enabled=true

# We build chat models manually (one per provider) for multi-provider support, so turn off the
# OpenAI chat/embedding auto-configuration that would otherwise create a single competing bean.
spring.ai.model.chat=none
spring.ai.model.embedding=none

# --- LLM providers (all OpenAI-API-compatible) ---
# Pick the starting provider here or via APP_LLM_DEFAULT_PROVIDER. Switch at runtime with /use.
app.llm.default-provider=gemini

# Google Gemini via its OpenAI-compatible endpoint (note: base URL already includes /v1beta/openai).
app.llm.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.llm.providers.gemini.completions-path=/chat/completions
app.llm.providers.gemini.api-key=${GEMINI_API_KEY:}
app.llm.providers.gemini.model=gemini-2.5-flash
app.llm.providers.gemini.temperature=0.0

# SiliconFlow (native OpenAI-compatible API). DeepSeek-V3 supports tool/function calling.
app.llm.providers.siliconflow.base-url=https://api.siliconflow.cn
app.llm.providers.siliconflow.completions-path=/v1/chat/completions
app.llm.providers.siliconflow.api-key=${SILICONFLOW_API_KEY:}
app.llm.providers.siliconflow.model=deepseek-ai/DeepSeek-V3
app.llm.providers.siliconflow.temperature=0.0
