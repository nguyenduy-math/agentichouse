# MCP server runs over stdio: stdout is the JSON-RPC channel, so:
#  - no web server
#  - no banner / console logging (would corrupt the protocol stream)
#  - logs go to a file instead
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=java-utility-mcp
spring.ai.mcp.server.version=0.0.1

# Never log to the console on stdio transport.
logging.pattern.console=
logging.file.name=./mcp-server.log
logging.level.root=INFO
