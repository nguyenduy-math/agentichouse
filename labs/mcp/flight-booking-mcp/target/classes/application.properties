# MCP server runs over stdio (NOT HTTP/SSE)
spring.main.web-application-type=none
spring.main.banner-mode=off

# MCP stdio transport + advertised server metadata
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=flight-booking-mcp
spring.ai.mcp.server.version=0.0.1

# H2 in-memory database + JPA. Schema is created from the @Entity classes on startup
# and seeded by SampleDataLoader. DB_CLOSE_DELAY keeps the in-memory DB alive for the
# lifetime of the JVM.
spring.datasource.url=jdbc:h2:mem:flights;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging: to file only. stdout is the MCP JSON-RPC channel and must stay clean.
logging.pattern.console=
logging.file.name=./mcp-server.log
logging.level.root=INFO
