version: "3.9"

services:

  neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.0-flash}
      - GEMINI_EMBED_MODEL=${GEMINI_EMBED_MODEL:-text-embedding-004}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      - SILICONFLOW_EMBED_MODEL=${SILICONFLOW_EMBED_MODEL:-BAAI/bge-large-zh-v1.5}
      - GRAPHRAG_ROOT=/app/graphrag_workspace
      - GRAPHRAG_QUERY_MODEL=${GRAPHRAG_QUERY_MODEL:-gemini-2.0-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-60}
      - CORS_ORIGINS=http://localhost:80
      # LangSmith — disabled by default to avoid accidental billing
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-new-rag-2026}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      # Retrieval quality
      - ENABLE_RERANK=${ENABLE_RERANK:-true}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_RERANK_MODEL=${COHERE_RERANK_MODEL:-rerank-multilingual-v3.0}
      - RERANK_CANDIDATE_POOL=${RERANK_CANDIDATE_POOL:-25}
      - MAX_LOCAL_CHUNKS=${MAX_LOCAL_CHUNKS:-8}
      - GRAPH_HOP_DEPTH=${GRAPH_HOP_DEPTH:-2}
      - ENABLE_ANSWER_VERIFICATION=${ENABLE_ANSWER_VERIFICATION:-true}
      - VERIFICATION_CONFIDENCE_THRESHOLD=${VERIFICATION_CONFIDENCE_THRESHOLD:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - graphrag_data:/app/graphrag_workspace
      - documents_data:/app/data/documents
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  graphrag_data:
  documents_data:
